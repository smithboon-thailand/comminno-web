<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <!--
      Comm.Inno content studio — Sveltia CMS.

      Sveltia is a fast, modern, drop-in replacement for Decap CMS that reads
      the same `config.yml` schema. Editors authenticate with their GitHub
      account; every save opens a pull request against `main` so two pairs of
      eyes review every change before it goes live (see EDITORIAL.md).

      We pin to a known-good Sveltia release rather than tracking `latest` so
      the studio never breaks unexpectedly. Bump deliberately when a new
      release lands.

      The `noindex` meta and the matching `Disallow: /admin/` line in
      /robots.txt are belt-and-suspenders against accidental indexing — the
      studio is also gated by GitHub OAuth, so a stranger can't get past the
      sign-in screen.
    -->
    <meta name="robots" content="noindex,nofollow" />
    <title>Comm.Inno — content studio</title>
    <style>
      /* Plain dark fallback while Sveltia's bundle (~700 KB) loads. */
      html,
      body {
        margin: 0;
        background: #0f1115;
        color: #e7e9ee;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        min-height: 100vh;
      }
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
      }
      .boot h1 {
        font-size: 1.05rem;
        font-weight: 500;
        opacity: 0.85;
        margin: 0 0 0.5rem;
      }
      .boot p {
        font-size: 0.85rem;
        opacity: 0.55;
        margin: 0;
        max-width: 32rem;
      }
      .boot small {
        margin-top: 1.5rem;
        font-size: 0.7rem;
        opacity: 0.4;
        letter-spacing: 0.04em;
      }
      /* Sveltia mounts into <body> and replaces the loader. */
    </style>
  </head>
  <body>
    <div class="boot" id="boot">
      <h1>Loading content studio…</h1>
      <p>
        First load may take a few seconds. If this screen stays for more than a
        minute, hard-refresh (Cmd/Ctrl + Shift + R) and check the browser
        console.
      </p>
      <small>Sveltia CMS · Comm.Inno · sign in with GitHub</small>
    </div>
    <!--
      Pinned to an EXACT version with a Subresource Integrity hash.

      This previously read `@sveltia/cms@^0.42`, a semver *range*: unpkg served
      whatever the newest 0.42.x was at load time, so the code running in an
      editor's browser could change with no commit to this repository — on the
      one page where that editor holds a GitHub OAuth token with write access
      (audit finding 8.1). There was no integrity hash either, so a tampered
      or compromised CDN response would simply have executed.

      With the exact pin plus `integrity`, the browser refuses to run the
      script unless the bytes hash to exactly what we verified. `crossorigin`
      is required for SRI to be enforced on a cross-origin script.

      To upgrade: fetch the new file, recompute the hash with
        curl -sL https://unpkg.com/@sveltia/cms@<VERSION>/dist/sveltia-cms.js \
          | openssl dgst -sha384 -binary | openssl base64 -A
      update both the URL and the integrity value in the same commit, then
      smoke-test on a feature branch before merging. Never widen the version
      back to a range.
    -->
    <script
      type="module"
      src="https://unpkg.com/@sveltia/cms@0.42.2/dist/sveltia-cms.js"
      integrity="sha384-CUmz8eMZLCc+45k8W+QKATPT6SvWeEuZncHCs4bwiKbW8raalroW/A7vxSQvqLxW"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
