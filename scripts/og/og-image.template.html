<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'DMSerif';src:url('file:///home/user/comminno-web/client/public/fonts/dm-serif-display-latin-400.woff2') format('woff2');}
@font-face{font-family:'InterL';src:url('file:///home/user/comminno-web/client/public/fonts/inter-latin-400.woff2') format('woff2');}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;
  background:
    radial-gradient(120% 80% at 100% 0%, rgba(39,158,214,.13) 0%, transparent 60%),
    radial-gradient(120% 80% at 0% 100%, rgba(241,166,29,.13) 0%, transparent 55%),
    #FAFAF8;
  font-family:'InterL',sans-serif;position:relative;}
.dots{position:absolute;inset:0;opacity:.05;
  background-image:radial-gradient(#0F1419 1px, transparent 1px);background-size:4px 4px;}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;gap:34px;padding:64px 80px;}
.eyebrow{font-size:20px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#BD212D;}
h1{font-family:'DMSerif',Georgia,serif;font-weight:400;font-size:56px;line-height:1.12;color:#0F1419;max-width:21ch;letter-spacing:-.01em;}
.rule{width:88px;height:5px;background:#BD212D;margin:26px 0 24px;}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;border-top:1px solid #E2E8F0;padding-top:26px;}
  .org{font-size:19px;line-height:1.45;color:#4A5568;max-width:40ch;}
.org b{color:#0F1419;font-weight:600;}
.bars{display:flex;gap:9px;}
  .bars i{display:block;width:13px;height:44px;border-radius:2px;}
</style></head><body>
<div class="dots"></div>
<div class="wrap">
  <div>
    <div class="eyebrow">Comm.Inno · Chulalongkorn University</div>
    <div class="rule"></div>
    <h1>Communication that listens. Innovation that improves life.</h1>
  </div>
  <div class="foot">
    <div class="org">
      <b>Center of Excellence in Communication Innovation</b><br>
      for the Development of Quality of Life and Sustainability<br>
      Faculty of Communication Arts
    </div>
    <div class="bars">
      <i style="background:#F1A61D"></i><i style="background:#BD212D"></i>
      <i style="background:#279ED6"></i><i style="background:#8DC63F"></i>
    </div>
  </div>
</div>
</body></html>
